<body>

        <main>
            <div id="side-panel-placeholder"></div>
            <div class="archive" id="archive-grid">
                <!-- Will be filled in dynamically -->
            </div>

            <div id="archive-popup" style="display: none">
                <div id="archive-popup-flex">
                    <div id="archive-popup-center">

    <script src="main.js"></script>

    <script>

            { src: "assets/gallery/DSCF5421.jpg", alt: "" },
            { src: "assets/gallery/DSCF5409.jpg", alt: "" },
        ];

        const archive = document.getElementById("archive-grid");
        const popup = document.getElementById("archive-popup");
        const popup_image = document.getElementById("archive-popup-image");
        const popup_alt = document.getElementById("archive-popup-alt");

        // Whether the popup is currently open
        let popup_open = false;

        // When the popup is clicked, hide it
        popup.onclick = () => {
            popup_open = false;
            popup.style.setProperty("display", "none");
        };

        IMAGES.forEach(image => {
            const element = document.createElement("img");
            element.setAttribute("src", image.src);
            element.setAttribute("alt", image.alt);
            element.setAttribute("loading", "lazy"); // This makes the images at the top of the page load first instead of having all the images half-loaded at once

            element.onclick = () => {
                console.log("GG");
                popup_open = true;
                popup.style.setProperty("display", "block");
                popup_image.setAttribute("src", image.src);
                popup_image.setAttribute("alt", image.alt);
                popup_alt.innerHTML = image.alt;
            };

            archive.appendChild(element);
        });
    </script>
</body>
